[project]
name = "haravajarjestelma"
requires-python = ">=3.12, <3.13"
version = "1.7.4"
dependencies = [
    "django-cors-headers",
    "django-environ",
    "django-filter",
    "django-helusers",
    "django-helsinki-health-endpoints",
    "django-ilmoitin",
    "django-logger-extra",
    "django-munigeo",
    "django-parler<2.4",
    "django-parler-rest",
    "djangorestframework",
    "djangorestframework-gis",
    # Note to future Django 6 upgrader:
    # harava-osm.html must be migrated
    "django~=5.2",
    "drf-oidc-auth",
    "factory-boy",
    "helsinki-profile-gdpr-api",
    "holidays",
    "psycopg[c]",
    "pytz",
    "requests",
    "sentry-sdk",
    "social-auth-app-django",
]

[dependency-groups]
dev = [
    "freezegun",
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "responses",
]
prod = [
    "uwsgi",
    "uwsgitop",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "haravajarjestelma.settings"
norecursedirs = ["node_modules", ".git", "venv*"]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE"

[tool.coverage.run]
branch = true
omit = ["*migrations*", "*site-packages*", "*venv*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
    # pyupgrade
    "UP",
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501"] }
